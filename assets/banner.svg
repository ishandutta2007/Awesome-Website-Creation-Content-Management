<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </linearGradient>

    <!-- Subtle Background Glow Filters -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .gradient-word {
      fill: url(#primaryGlow);
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .code-symbol {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-weight: bold;
      fill: #38bdf8;
    }

    /* Ambient Pulsing Background Orbs */
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.45; }
      50% { transform: translate(60px, -20px) scale(1.15); opacity: 0.7; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.4; }
      50% { transform: translate(-50px, 30px) scale(1.2); opacity: 0.65; }
    }
    .orb-1 {
      animation: pulseOrb1 9s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb2 11s ease-in-out infinite;
      transform-origin: 1000px 260px;
    }

    /* Animated Floating Interactive Badges/Pills in Background/Periphery */
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .pill-anim-1 { animation: floatPill1 6s ease-in-out infinite; }
    .pill-anim-2 { animation: floatPill2 7.5s ease-in-out infinite 1s; }
    .pill-anim-3 { animation: floatPill3 5.5s ease-in-out infinite 0.5s; }

    /* Flow lines animation */
    @keyframes dashMove {
      to {
        stroke-dashoffset: -40;
      }
    }
    .animated-wire {
      stroke-dasharray: 6 6;
      animation: dashMove 2.5s linear infinite;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />

  <!-- Subtle High-Tech Blueprint Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Glowing Atmospheric Orbs (Behind content) -->
  <circle class="orb-1" cx="220" cy="110" r="160" fill="url(#accentCyan)" filter="url(#blurFilter)" />
  <circle class="orb-2" cx="980" cy="240" r="170" fill="url(#accentPurple)" filter="url(#blurFilter)" />

  <!-- Dynamic Flow Lines in Periphery -->
  <g opacity="0.25">
    <path class="animated-wire" d="M 60 180 C 140 180, 180 90, 260 90" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="animated-wire" d="M 940 270 C 1020 270, 1060 180, 1140 180" fill="none" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Ambient Dynamic Badges (Periphery / Floating Cards) -->
  <!-- Top Left Pill: Headless CMS -->
  <g class="pill-anim-1" transform="translate(60, 48)">
    <rect width="145" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#38bdf8" />
    <text x="85" y="17" class="pill-label">⚡ Headless CMS</text>
  </g>

  <!-- Bottom Left Pill: Static Sites -->
  <g class="pill-anim-2" transform="translate(70, 275)">
    <rect width="145" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#818cf8" />
    <text x="85" y="17" class="pill-label">🚀 Static Sites</text>
  </g>

  <!-- Top Right Pill: Visual Builders -->
  <g class="pill-anim-3" transform="translate(980, 50)">
    <rect width="155" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#c084fc" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#c084fc" />
    <text x="90" y="17" class="pill-label">🎨 Visual Builders</text>
  </g>

  <!-- Bottom Right Pill: Open Source -->
  <g class="pill-anim-1" transform="translate(970, 275)">
    <rect width="165" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#10b981" />
    <text x="95" y="17" class="pill-label">✨ 100% Open Source</text>
  </g>

  <!-- Foreground Content Block: Title & Subtitle (Always in crystal clear focus) -->
  <!-- Decorative Header Tag -->
  <g transform="translate(600, 78)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
    <text x="0" y="2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">CURATED AWESOME DIRECTORY</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(600, 142)">
    <text class="title-text" text-anchor="middle">
      Awesome <tspan class="gradient-word">Website Creation</tspan> &amp; CMS
    </text>
  </g>

  <!-- Subtitle Paragraph -->
  <g transform="translate(600, 192)">
    <text class="subtitle-text" text-anchor="middle">
      Top Commercial SaaS Website Builders &amp; High-Performance Open-Source CMS Solutions
    </text>
  </g>

  <!-- Feature Pills Row (Centered foreground) -->
  <g transform="translate(600, 240)">
    <!-- Pill 1: Headless & Monolith -->
    <g transform="translate(-240, 0)">
      <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle">🌐 Web Builders</text>
    </g>
    <!-- Pill 2: Headless CMS -->
    <g transform="translate(-80, 0)">
      <rect x="-70" y="-13" width="140" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle">📦 Headless &amp; DXP</text>
    </g>
    <!-- Pill 3: SSG & Islands -->
    <g transform="translate(85, 0)">
      <rect x="-75" y="-13" width="150" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle">⚡ Fast Static Engines</text>
    </g>
    <!-- Pill 4: Self-Hosted -->
    <g transform="translate(245, 0)">
      <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle">🛡️ Self-Hosted</text>
    </g>
  </g>

  <!-- Modern Subtle Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />
</svg>
